name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build_and_test:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: coverage
        run: |
          npm run coverage
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const summaryPath = path.resolve(process.cwd(), 'coverage', 'coverage-summary.json');
          if (!fs.existsSync(summaryPath)) {
            throw new Error(`Coverage summary not found: ${summaryPath}`);
          }
          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const total = summary.total;
          const rows = [
            '| metric | pct | covered | total |',
            '|---|---|---|---|',
            `| Lines | ${total.lines.pct}% | ${total.lines.covered} | ${total.lines.total} |`,
            `| Statements | ${total.statements.pct}% | ${total.statements.covered} | ${total.statements.total} |`,
            `| Branches | ${total.branches.pct}% | ${total.branches.covered} | ${total.branches.total} |`,
            `| Functions | ${total.functions.pct}% | ${total.functions.covered} | ${total.functions.total} |`,
          ].join('\n');
          const comment = [
            '### Coverage report',
            '',
            rows,
            '',
            '> Generated by CI workflow using Vitest coverage',
          ].join('\n');
          console.log(`coverage_md<<EOF\n${comment}\nEOF`);
          NODE
        shell: bash

      - name: Comment coverage on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.coverage.outputs.coverage_md }}
          comment-id: coverage-report

      - name: Build project
        run: npm run build

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
