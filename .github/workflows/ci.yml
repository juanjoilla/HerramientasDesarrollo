name: CI

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build_and_test:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: coverage
        run: |
          npm run coverage
          coverage_md=$(node -e '
            const fs = require("fs");
            const path = require("path");
            const summaryPath = path.resolve(process.cwd(), "coverage", "coverage-summary.json");
            if (!fs.existsSync(summaryPath)) {
              throw new Error(`Coverage summary not found: ${summaryPath}`);
            }
            const total = JSON.parse(fs.readFileSync(summaryPath, "utf8")).total;
            const rows = [
              "| metric | pct | covered | total |",
              "|---|---|---|---|",
              `| Lines | ${total.lines.pct}% | ${total.lines.covered} | ${total.lines.total} |`,
              `| Statements | ${total.statements.pct}% | ${total.statements.covered} | ${total.statements.total} |`,
              `| Branches | ${total.branches.pct}% | ${total.branches.covered} | ${total.branches.total} |`,
              `| Functions | ${total.functions.pct}% | ${total.functions.covered} | ${total.functions.total} |`,
            ];
            const comment = [
              "### Coverage report",
              "",
              rows.join("\n"),
              "",
              "> Generated by CI workflow using Vitest coverage",
              "",
              "<!-- coverage-report -->",
            ].join("\n");
            process.stdout.write(comment);
          ')
          echo "coverage_md<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "$coverage_md" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Comment coverage on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          api="https://api.github.com/repos/$REPO"
          comment_body="${{ steps.coverage.outputs.coverage_md }}"
          export COMMENT_BODY="$comment_body"
          export MARKER='<!-- coverage-report -->'

          existing_comment_id=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$api/issues/$PR_NUMBER/comments" | node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            const marker = process.env.MARKER;
            const comment = data.find(c => c.body && c.body.includes(marker));
            if (comment) process.stdout.write(comment.id.toString());
          ')

          payload=$(node -e '
            const body = process.env.COMMENT_BODY || "";
            console.log(JSON.stringify({ body }));
          ')

          if [ -n "$existing_comment_id" ]; then
            curl -sS -X PATCH \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$payload" \
              "$api/issues/comments/$existing_comment_id"
          else
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$payload" \
              "$api/issues/$PR_NUMBER/comments"
          fi
        shell: bash

      - name: Build project
        run: npm run build

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
